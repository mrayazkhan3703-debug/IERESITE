# Online staging topology. The web process never runs the queue scheduler;
# all asynchronous work is owned by the dedicated background worker.
services:
  - type: web
    name: IERESITE
    runtime: docker
    region: oregon
    plan: free
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh scripts/start-staging-web.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: STAGING_WEB_ONLY
        value: "false"
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: 0.0.0.0
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: iere-staging-media
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: SEARCH_PROVIDER
        value: postgres
      - key: AI_PROVIDER
        value: gemini
      - key: AI_LIVE_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: IP_PSEUDONYM_KEY
        sync: false
      - key: CRM_PROVIDER
        value: localdev
      - key: CRM_LIVE_ENABLED
        value: "false"
      - key: EMAIL_PROVIDER
        value: localdev
      - key: JOB_SCHEDULER_ENABLED
        value: "false"

  - type: worker
    name: iere-staging-worker
    runtime: docker
    region: oregon
    plan: starter
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh scripts/start-staging-worker.sh
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: STAGING_WEB_ONLY
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: iere-staging-media
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: SEARCH_PROVIDER
        value: postgres
      - key: AI_PROVIDER
        value: gemini
      - key: AI_LIVE_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: IP_PSEUDONYM_KEY
        sync: false
      - key: CRM_PROVIDER
        value: localdev
      - key: CRM_LIVE_ENABLED
        value: "false"
      - key: EMAIL_PROVIDER
        value: localdev
      - key: JOB_SCHEDULER_ENABLED
        value: "true"
      - key: JOB_INTERVAL_MS
        value: "15000"
      - key: WORKER_HEALTH_PORT
        value: "3001"
