name: Local Docker CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-policy:
    name: Windows recovery metadata policy
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse backup and recovery scripts without executing them
        shell: powershell
        run: |
          $policyFiles = @('scripts/recovery-targets.ps1', 'scripts/backup-local.ps1', 'scripts/backup-hosted.ps1', 'scripts/new-live-backup-identity.ps1', 'scripts/enable-hosted-backup-schedule.ps1', 'scripts/restore-drill-local.ps1', 'tests/recovery-targets.policy.ps1', 'scripts/backup-operations-policy.ps1', 'scripts/prepare-backup-schedule.ps1', 'scripts/run-backup-operations.ps1', 'tests/backup-operations.policy.ps1', 'scripts/backup-runner.ps1', 'scripts/configure-backup-recipient.ps1', 'scripts/verify-backup-roundtrip.ps1', 'tests/backup-runner.policy.ps1')
          foreach ($policyFile in $policyFiles) {
            $parseTokens = $null
            $parseErrors = $null
            $resolvedFile = Join-Path $env:GITHUB_WORKSPACE $policyFile
            [System.Management.Automation.Language.Parser]::ParseFile($resolvedFile, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -ne 0) { throw "Invalid PowerShell syntax in $policyFile" }
          }

      - name: Verify official targets without Docker or archive access
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\recovery-targets.policy.ps1

      - name: Verify approved schedule and retention metadata without registration
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\backup-operations.policy.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\backup-runner.policy.ps1

  local-docker:
    name: Production-like local stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tracked filenames and Docker context hygiene
        run: |
          node scripts/check-repository-hygiene.mjs
          if git check-ignore --no-index -- src/server/search/local-provider.ts src/server/monitoring/local-alerts.ts src/server/monitoring/local-transport.ts tests/local-alert-delivery.smtp.ts tests/local-alerts.test.ts tests/performance/local-navigation.spec.ts tests/static-asset-inventory.test.ts scripts/report-backup-operations.mjs tests/backup-operations-report.test.ts; then
            echo "Required CI sources must not be ignored."
            exit 1
          else
            ignore_status=$?
            test "$ignore_status" -eq 1
          fi

      - name: Check local asset metadata and literal source references
        run: node scripts/audit-local-assets.mjs

      - name: Scan working source and full local Git history (redacted metadata only)
        run: node scripts/verify-repository-secrets.mjs

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start production-like local services
        run: docker compose up -d --build

      - name: Verify applied database migrations
        run: docker compose exec -T web bunx prisma migrate status

      - name: Enforce local-only provider defaults
        run: |
          set -eu
          for service in web worker; do
            docker compose exec -T "$service" sh -lc \
              'test "$AI_LIVE_ENABLED" = false &&
               test "$CRM_LIVE_ENABLED" = false &&
               test "$AI_PROVIDER" = mock &&
               test "$CRM_PROVIDER" = localdev'
          done

      - name: Lint
        run: docker compose exec -T web bun run lint

      - name: Typecheck
        run: docker compose exec -T web bun run typecheck

      - name: Unit and isolated contract tests
        run: docker compose exec -T web bun run test:unit

      - name: PostgreSQL and HTTP integration tests
        # CI has already enforced mock/localdev on web; do not rely on host DNS
        # or an optional web-test container that is not started at this step.
        run: docker compose exec -T -e TEST_BASE_URL=http://web:3000 web bun run test:integration

      - name: Active worker container shutdown and retry
        run: node scripts/verify-worker-container-shutdown.mjs

      - name: Local alert SMTP delivery and recovery (disposable Mailpit)
        run: docker compose --profile monitor-test run --build --rm monitor-test

      - name: Synthetic public/private object archive and restored reads
        run: node scripts/create-object-restore-fixture.mjs --verify

      - name: Isolated encrypted S3 backup adapter (synthetic only)
        run: |
          docker build -f docker/backup-tools.Dockerfile -t iere-local-backup-tools .
          docker run --rm --network none --entrypoint bun iere-local-backup-tools --no-env-file test tests/backup-adapter.test.ts tests/backup-storage-cap.test.ts tests/hosted-backup.test.ts tests/railway-backup.test.ts tests/r2-backup-verification.test.ts tests/backup-operations-report.test.ts tests/disposable-environment.test.ts tests/transition-capture.test.ts
          node scripts/verify-backup-adapter.mjs

      - name: Seed deterministic browser fixtures
        run: docker compose exec -T web bun run seed

      - name: Storage cutover pause HTTP checks (disposable only)
        run: |
          docker compose run -d --no-deps --name iere-storage-paused-verification -e STORAGE_MUTATIONS_PAUSED=true web
          trap 'docker rm -f iere-storage-paused-verification >/dev/null 2>&1 || true' EXIT
          docker exec iere-storage-paused-verification bun scripts/check-paused-storage.mjs

      - name: Browser accessibility and responsive-image smoke
        run: docker compose --profile test run --build --rm -v "${{ github.workspace }}/test-results:/app/test-results" accessibility

      - name: Local browser delivery measurements
        run: docker compose --profile test run --rm -v "${{ github.workspace }}/test-results:/app/test-results" accessibility bun run test:performance

      - name: Evaluate candidate local performance budgets (not field CWV)
        run: node scripts/check-local-performance-budgets.mjs

      - name: Retain browser verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-browser-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Capture service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=250

      - name: Remove ephemeral CI containers and volumes
        if: always()
        run: docker compose down --remove-orphans --volumes
